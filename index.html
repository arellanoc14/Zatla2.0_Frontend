<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zatla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="#">Zatla</a>
    <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="links">&#9776;</button>
    <ul id="links" class="links">
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <header class="hero">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assets/header.mp4" type="video/mp4">
    </video>
  </header>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>Section one content goes here.</p>
    </section>
    <section id="services">
      <h2>Services</h2>
      <p>Section two content goes here.</p>
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 Zatla</p>
  </footer>

  <script>
    const btn = document.querySelector('.menu-btn');
    btn.onclick = () => btn.setAttribute('aria-expanded', document.body.classList.toggle('menu-open'));
  </script>
</body>
</html>
